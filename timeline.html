<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <title>Deadline</title>
  <link rel="stylesheet" href="https://p.trellocdn.com/power-up.min.css">
  <script src="https://p.trellocdn.com/power-up.min.js"></script>
  <style>
    body { margin: 0; padding: 12px 16px; font-family: -apple-system, "Segoe UI", Roboto, sans-serif; color: #172b4d; background: #f7f8f9; }
    .top { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; margin-bottom: 10px; }
    .top select { margin: 0; width: auto; }
    .leg { display: flex; gap: 12px; flex-wrap: wrap; font-size: 12px; color: #44546f; }
    .leg i { display: inline-block; width: 12px; height: 12px; border-radius: 3px; vertical-align: -2px; margin-right: 4px; }
    #wrap { position: relative; overflow-x: auto; overflow-y: hidden; background: #fff; border: 1px solid #dcdfe4; border-radius: 8px; }
    #area { position: relative; }
    .tick { position: absolute; top: 0; bottom: 0; border-left: 1px dashed #e4e6ea; }
    .tick span { position: absolute; top: 4px; left: 4px; font-size: 11px; color: #8590a2; white-space: nowrap; }
    .oggi { position: absolute; top: 0; bottom: 0; border-left: 3px solid #0c66e4; z-index: 2; }
    .oggi span { position: absolute; top: 4px; left: 6px; background: #0c66e4; color: #fff; font-size: 11px; font-weight: 700; padding: 2px 6px; border-radius: 4px; white-space: nowrap; }
    .box { position: absolute; z-index: 3; width: 180px; box-sizing: border-box; padding: 6px 8px; border-radius: 6px; cursor: pointer; font-size: 12px; line-height: 1.3; box-shadow: 0 1px 2px rgba(9,30,66,.25); border-left: 5px solid rgba(0,0,0,.25); }
    .box:hover { filter: brightness(.95); }
    .box b { display: block; font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .box .ck { opacity: .85; }
    .pin { position: absolute; z-index: 1; width: 2px; }
    .verde { background: #baf3db; color: #164b35; } .pin.verde { background: #4bce97; }
    .giallo { background: #f8e6a0; color: #533f04; } .pin.giallo { background: #e2b203; }
    .rosso { background: #ffd5d2; color: #5d1f1a; } .pin.rosso { background: #f87168; }
    .viola { background: #dfd8fd; color: #352c63; } .pin.viola { background: #9f8fef; }
    .grigio { background: #dcdfe4; color: #44546f; } .pin.grigio { background: #8590a2; }
    .nodata { margin-top: 12px; font-size: 13px; }
    .nodata span { display: inline-block; margin: 4px 6px 0 0; padding: 4px 8px; background: #dcdfe4; border-radius: 4px; cursor: pointer; }
    .mat { margin-top: 3px; padding-top: 3px; border-top: 1px solid rgba(0,0,0,.12); font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .mat-ok { color: #216e4e; } .mat-wait { color: #7f5f01; } .mat-ko { color: #ae2e24; } .mat-nd { color: #626f86; font-weight: 400; }
    .box.alert { outline: 2px solid #e34935; outline-offset: -2px; }
    .box.sel { box-shadow: 0 0 0 3px #0c66e4; }
    #det { margin-top: 12px; background: #fff; border: 1px solid #dcdfe4; border-radius: 8px; padding: 10px 14px; font-size: 13px; }
    #det h4 { margin: 0 0 4px; } #det p { margin: 0 0 8px; color: #44546f; }
    #det table { border-collapse: collapse; width: 100%; } #det th, #det td { text-align: left; padding: 4px 6px; border-bottom: 1px solid #ebecf0; }
    #det tr.rit td { color: #ae2e24; font-weight: 600; }
    #auth { margin: 0 0 10px; padding: 8px 12px; background: #e9f2ff; border-radius: 6px; font-size: 13px; }
    #auth button, .apri { margin: 0 0 0 8px; padding: 2px 10px; font-size: 12px; }
    .vuoto { padding: 40px; text-align: center; color: #5e6c84; }
  </style>
</head>
<body>
  <div class="top">
    <label>Lista <select id="lista"></select></label>
    <div class="leg">
      <span><i class="verde"></i>Oltre 10 giorni</span>
      <span><i class="giallo"></i>Entro 10 giorni</span>
      <span><i class="rosso"></i>Scadute</span>
      <span><i class="viola"></i>Scadute da più di 10 giorni</span>
    </div>
  </div>
  <div id="auth" style="display:none">&#128230; Per vedere il materiale da Ready Web serve autorizzare (una volta sola) la lettura delle checklist. <button id="autorizza">Autorizza</button></div>
  <div id="wrap"><div id="area"></div></div>
  <div id="det"><i>Clicca una commessa per vedere il dettaglio del materiale.</i></div>
  <div class="nodata" id="nodata"></div>

  <script src="./js/common.js?v=5"></script>
  <script src="./js/timeline.js?v=5"></script>
</body>
</html>
